<html>
    <head>
        <title> 7g </title>
    </head>
    <body>
        <script>
            function convertLength(lenght, from, to){
                if (from === 'miles' && to === 'km'){
                    result = lenght * 1.6;
                    return `${result} km`;
                } else if (from === 'km' && to === 'miles'){
                    result = lenght / 1.6;
                    return `${result} miles`;
                } else if (from === to) {
                    return `${lenght} ${to}`;
                } else {
                    return `Invalid parameters`
                }
            }
            console.log(convertLength(50,'miles','km'));
            console.log(convertLength(32,'km','miles'));
            console.log(convertLength(50,'km','km'));
            console.log(convertLength(50,'m','cm'));
        </script>
    </body>
</html>
